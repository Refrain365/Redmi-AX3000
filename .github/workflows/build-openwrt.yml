name: Redmi AX3000 ImmortalWrt ipq50xx + rkp-ipid

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/kmiit/Redmi_AX3000_immortalwrt
  REPO_BRANCH: redmi_ax3000-24.10
  RKP_URL: https://github.com/CHN-beta/rkp-ipid
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool libelf-dev libncurses-dev libssl-dev \
            libtool libyaml-dev libz-dev lrzsz mkisofs msmtp nano ninja-build p7zip-full patch pkgconf \
            python3 python3-pip python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone redmi_ax3000-24.10
        run: |
          git clone --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          git log -1 --format='%H %s'
          echo "已使用分支头编译"
          cd ..

      - name: Assert ipq50xx + redmi profile
        run: |
          cd openwrt
          test -d target/linux/qualcommax/ipq50xx || { echo "::error::无 qualcommax/ipq50xx"; exit 1; }
          echo "--- ipq50xx 设备定义 ---"
          grep -rli "redmi.ax3000" target/linux/qualcommax/ipq50xx/ || true

      - name: Add rkp-ipid
        run: |
          cd openwrt
          git clone "$RKP_URL" package/rkp-ipid

      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_redmi_ax3000=y
          CONFIG_PACKAGE_kmod-rkp-ipid=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_kmod-ipt-ipopt=y
          CONFIG_PACKAGE_iptables-mod-u32=y
          CONFIG_PACKAGE_iptables-mod-filter=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_NETFILTER_NETLINK_GLUE_CT=y
          EOF
          make defconfig

      - name: Verify target
        run: |
          cd openwrt
          grep -E '^CONFIG_TARGET_' .config || true
          grep -q '^CONFIG_TARGET_QUALCOMMAX_IPQ50XX=y' .config || {
            echo "::error::defconfig 后不是 ipq50xx，检查上面 TARGET 输出"
            exit 1
          }
          grep -qE 'DEVICE_REDMI_AX3000=y|DEVICE_redmi_ax3000=y' .config || \
            echo "::warning::DEVICE_redmi_ax3000 未严格命中，按实际 profile 名修改"

      - name: Download
        run: cd openwrt && make download -j8

      - name: Build
        run: |
          cd openwrt
          make -j"$(nproc)" V=s 2>&1 | tee build.log || make -j1 V=s

      - name: Keep only sysupgrade
        run: |
          cd openwrt/bin/targets/qualcommax/ipq50xx
          ls -lh
          mkdir -p /tmp/out
          cp *sysupgrade* /tmp/out/ || true
          cp sha256sums /tmp/out/ 2>/dev/null || true

      - name: Upload sysupgrade
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax3000-ipq50xx-rkp-ipid
          path: /tmp/out/*
