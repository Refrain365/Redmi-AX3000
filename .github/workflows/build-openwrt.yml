name: Build ImmortalWrt ipq50xx + rkp-ipid

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: "24.10"
  COMMIT: "r0-cb4f52a"   # 留空则用分支最新；要同你线上就填 r0-cb4f52a
  TARGET: qualcommax/ipq50xx
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool libelf-dev libncurses-dev libssl-dev \
            libtool libyaml-dev libz-dev lrzsz mkisofs msmtp nano ninja-build p7zip-full patch pkgconf \
            python3 python3-pip python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone source
        run: |
          git clone --single-branch --branch "$REPO_BRANCH" --filter=blob:none "$REPO_URL" openwrt
          if [ -n "$COMMIT" ]; then
            cd openwrt && git checkout "$COMMIT" && cd ..
          fi

      - name: Add rkp-ipid / ua2f
        run: |
          cd openwrt
          git clone https://github.com/CHN-beta/rkp-ipid package/rkp-ipid
          git clone https://github.com/Zxilly/UA2F package/UA2F

      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_redmi_ax3000=y
          CONFIG_PACKAGE_kmod-rkp-ipid=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_kmod-ipt-ipopt=y
          CONFIG_PACKAGE_iptables-mod-u32=y
          CONFIG_PACKAGE_iptables-mod-filter=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_ua2f=y
          CONFIG_PACKAGE_luci-app-ua2f=y
          CONFIG_NETFILTER_NETLINK_GLUE_CT=y
          EOF
          make defconfig
          # 核对 target 是否落到 ipq50xx；不是就立刻失败，避免编出 ipq807x
          grep -E 'CONFIG_TARGET_QUALCOMMAX_IPQ50XX=y' .config || { echo "ipq50xx not selected"; exit 1; }

      - name: Download
        run: cd openwrt && make download -j8

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log || make -j1 V=s

      - name: Only keep sysupgrade
        run: |
          cd openwrt/bin/targets/qualcommax/ipq50xx
          ls -lh
          rm -f *.factory.* *.initramfs-* *.manifest *.buildinfo *.sha256 2>/dev/null || true
          mkdir -p /tmp/out
          cp *sysupgrade* /tmp/out/ || true

      - name: Upload sysupgrade only
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ipq50xx-sysupgrade
          path: /tmp/out/*
